name: Lint

on:
  pull_request:
    paths:
      - "client/**"

jobs:
  lint-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for diff against base branch

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # Lint only changed TS/TSX files to avoid blocking on legacy debt
      - name: Lint changed files
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }} -- '*.ts' '*.tsx' '*.js' '*.jsx' | tr '\n' ' ')
          if [ -z "$CHANGED" ]; then
            echo "No lintable files changed — skipping."
            exit 0
          fi
          echo "Linting: $CHANGED"
          npx eslint --max-warnings 0 $CHANGED
